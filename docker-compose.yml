services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-postgres
    environment:
      POSTGRES_DB: cloudstorage
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloudstorage"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./cloud-service-backend
    container_name: cloud-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ORIGINS: http://localhost:8081
    volumes:
      - file-storage:/app/storage/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  file-storage:
